<style>
:root{--bg:#f4f6fc;--card:#fff;--ink:#0f1a3a;--mute:#5b6585;--line:#dde1f0;--pri:#2e3fa8;--on:#fff;--ok:#12806a;--bad:#b4530a;--warm:#fdeccb;--warmink:#6b3d00;--off:#dde1f0;--okbg:#e6f5f1;--badbg:#fbeee3}
@media not all{:root:not([data-theme="light"]){--bg:#0e1226;--card:#171c36;--ink:#eef0fb;--mute:#9aa3c7;--line:#2b3157;--pri:#7d8cf5;--on:#0e1226;--ok:#3cc2a2;--bad:#f0914a;--warm:#3a2d12;--warmink:#f5cf8a;--off:#2b3157;--okbg:#12302a;--badbg:#38241a}}
html.dk{--bg:#0e1226;--card:#171c36;--ink:#eef0fb;--mute:#9aa3c7;--line:#2b3157;--pri:#7d8cf5;--on:#0e1226;--ok:#3cc2a2;--bad:#f0914a;--warm:#3a2d12;--warmink:#f5cf8a;--off:#2b3157;--okbg:#12302a;--badbg:#38241a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;font-size:16px;line-height:1.45}
#app{max-width:480px;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:30px;margin:0 0 14px;font-weight:700;line-height:1.2}
h2{font-size:17px;margin:18px 0 8px;font-weight:700}.sec{font-size:22px;font-weight:700;color:var(--pri);margin:30px 0 0;padding-top:14px;border-top:2px solid var(--line)}.sec:first-of-type{margin-top:6px;border:0;padding:0}
.sm{color:var(--mute);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:var(--warm);color:var(--warmink);border-radius:999px;padding:6px 14px;font-weight:700}
.hero{background:linear-gradient(135deg,#2e3fa8,#5b4fd8);color:#fff;border-radius:22px;padding:18px;margin:14px 0 12px;box-shadow:0 8px 20px rgba(46,63,168,.28)}.hero .btnw{background:#fff;color:#2e3fa8}
.hero b{font-size:20px;display:block}
.btnw{background:var(--on);color:var(--pri);border:0;border-radius:14px;padding:12px 18px;font-weight:700}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:14px;padding:12px 18px;font-weight:700}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:7px 14px;margin:0 6px 8px 0}
.chip.on{background:var(--pri);color:var(--on);border-color:var(--pri);font-weight:600}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{text-align:left;padding:14px 16px;background:var(--card);border:2px solid var(--line);border-radius:18px}
.tile b{display:block;font-size:18px}
.seg{display:flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);margin-top:10px}
.seg button{flex:1;border:0;background:none;padding:11px 4px}
.seg button.on{background:var(--pri);color:var(--on);font-weight:600}
.sw{width:52px;height:32px;border-radius:99px;background:var(--off);border:0;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--pri)}.sw.on::after{transform:translateX(20px)}
.set{padding:12px 0;border-bottom:2px solid var(--line)}.set:last-child{border:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;padding:9px 4px 8px;font-size:13px;line-height:1.25;color:var(--mute)}
nav button.on{color:var(--pri);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ob{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px}
.bar{height:10px;background:var(--off);border-radius:9px;margin:10px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:9px;transition:width .3s}
.q{font-size:22px;font-weight:700;margin:16px 0}

<script>
/* ===== প্রশ্ন শুধু অনলাইনে থাকে: অ্যাপের ভেতরে কোনো প্রশ্ন জমা থাকে না ===== */
(function(){

  Q.length=0; /* অ্যাপের ভেতরের নমুনা প্রশ্ন সরিয়ে ফেলা */
  var _start=start,idMap=null,done={},busy=false,READY=null,readyP=null;

  function getJSON(url){

    return fetch(url,{cache:"no-cache",signal:ctl?ctl.signal:undefined}).then(function(r){
      if(!r.ok){clearTimeout(to);throw "http"}
      return r.json().then(function(j){clearTimeout(to);return j},function(){clearTimeout(to);throw "slow"});
    },function(e){clearTimeout(to);throw (e&&e.name==="AbortError")?"slow":"net"});
  }
  /* সবখানে ব্যবহারের ছোট বক্স: বার্তা + বাটন */
  window.qzSheet=function(msg,btns){

      x.onclick=function(){w.remove();if(b.fn)b.fn()};

    document.body.appendChild(w);
  };
  /* কোন কোন বিষয়ে প্রশ্ন তৈরি হয়েছে (ready.json) */
  function readyList(){
    if(readyP)return readyP;

  }
  function topicId(title){
    if(idMap)return Promise.resolve(idMap[title]);
    return getJSON(QBASE+"topics.json").then(function(a){
      idMap={};a.forEach(function(t){idMap[t.title]=t.id});return idMap[title];
    });
  }
  function addQs(arr){
    var have={};Q.forEach(function(q){have[qid(q)]=1});
    arr.forEach(function(q){
      if(q&&q.bn&&q.o&&q.o.length===4&&q.a>=0&&q.a<4&&!have[qid(q)]){Q.push(q);have[qid(q)]=1}
    });
  }
  function load(title){
    return topicId(title).then(function(id){
      if(!id||done[id])return;
      return getJSON(QBASE+"questions/"+id+".json").then(function(arr){addQs(arr);done[id]=1},
        function(e){if(e==="net"||e==="slow")throw e;/* এই বিষয়ের ফাইল এখনও তৈরি হয়নি */});
    });
  }
  window.loadTopic=load;
  function loadAll(list){
    return Promise.all(list.map(function(t){return load(t).catch(function(e){if(e==="net"||e==="slow")throw e})}));
  }
  /* মিশ্র কুইজের (মক টেস্ট, দৈনিক চ্যালেঞ্জ) জন্য কয়েকটা প্রস্তুত বিষয় নামানো */
  function ensureMix(cb){
    if(Q.length>=40)return cb(true);
    readyList().then(function(r){
      var list=(r?r.list:[]).slice();
      for(var i=list.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=list[i];list[i]=list[j];list[j]=t}
      return loadAll(list.slice(0,4));
    }).then(function(){cb(Q.length>0)},function(e){cb(false,e)});
  }

  function withPool(arr,fn){

      readyList().then(function(r){

  if(typeof home==="function"){

  /* শুরুতেই তালিকা এনে পর্দা নতুন করে আঁকা */
  readyList().then(function(r){

/* ===== ভালো স্কোরে রঙিন উৎসব ===== */
(function(){
  if(typeof fin!=="function")return;
  function burst(){
    var c=document.createElement("canvas");
    c.style.cssText="position:fixed;left:0;top:0;width:100%;height:100%;z-index:900;pointer-events:none";
    var W=c.width=window.innerWidth,H=c.height=window.innerHeight;
    document.body.appendChild(c);
    var g=c.getContext("2d"),cols=["#fcc419","#3f5eff","#ff6b6b","#51cf66","#ffffff","#845ef7"],ps=[];
    for(var i=0;i<110;i++)ps.push({x:W/2+(Math.random()-.5)*80,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*13-3,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]});
    var t0=Date.now();
    (function f(){
      var el=Date.now()-t0;g.clearRect(0,0,W,H);
      ps.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.globalAlpha=Math.max(0,1-el/2600);g.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);g.restore()});
      if(el<2600)requestAnimationFrame(f);else c.remove();
    })();
  }
  var _fin=fin;
  window.fin=fin=function(){
    var r=_fin.apply(this,arguments);
    try{if(quiz&&quiz.done&&!quiz.cf){quiz.cf=1;if(quiz.list.length>0&&quiz.score/quiz.list.length>=0.7)burst()}}catch(e){}
    return r;
  };
})();
</script>

  X("ইন্টারনেট ধীর। আবার চেষ্টা করবে?","The internet is slow. Try again?");
  X("খুঁজতে ইন্টারনেট চালু করো","Turn on the internet to search");
  X("এখন খোঁজা গেল না। ইন্টারনেট দেখো।","Could not search right now. Check the internet.");
  X("এই নামে কোনো প্রশ্ন বা বিষয় পাওয়া যায়নি।","No question or topic found for this.");
  X("এই ফোনে বাংলা ভয়েস নেই। ফোনের Settings > টেক্সট-টু-স্পিচ (Text-to-speech) > Google > ভয়েস ডেটা ইনস্টল (Install voice data) > বাংলা বেছে নাও, তারপর আবার চেষ্টা করো।","This phone has no Bengali voice. Open Settings > Text-to-speech > Google > Install voice data > Bengali, then try again.");
  X("🏆 তুমি জিতেছ!","🏆 You won!");
  X("😅 এবার হেরে গেলে, আবার চেষ্টা করো","😅 You lost this time, try again");
  X("🤝 ড্র!","🤝 Draw!");

  var PATS=[
    [/^([\d.]+) সে\.$/,"$1 sec"],
    [/^([\d.]+) মি\.$/,"$1 min"],
    [/^রোজ (.+)-এ রিমাইন্ডার আসবে$/,"Reminder set for $1 every day"],
    [/^সময় বদলে (.+) হয়েছে$/,"Reminder time changed to $1"],
    [/^(\d+)টা বাছা হয়েছে$/,"$1 selected"],
    [/^(?:🔥 )?(\d+) দিনের স্ট্রিক!$/,"🔥 $1-day streak!"]
  ];
  function sym(k){
    var m=k.match(/^([✓✕×+⭐☆•·\-–]+\s+)?(.*?)(\s+[×✕✓])?$/);
    if(m&&m[2]&&Object.prototype.hasOwnProperty.call(T,m[2])&&(m[1]||m[3]))return (m[1]||"")+T[m[2]]+(m[3]||"");
    return null;
  }
  function trn(s){
    if(typeof s!=="string"||!isEn()||!/[\u0980-\u09FF]/.test(s))return s;
    var k=dg(s.trim());
    if(Object.prototype.hasOwnProperty.call(T,k))return T[k];
    var m=k.match(/^(❌|✅|🎉|⏰|🔥|⭐|⚔️) (.+)$/);
    if(m&&Object.prototype.hasOwnProperty.call(T,m[2]))return m[1]+" "+T[m[2]];
    for(var i=0;i<PATS.length;i++)if(PATS[i][0].test(k))return k.replace(PATS[i][0],PATS[i][1]);
    var y=sym(k);if(y)return y;
    return s;
  }
  window.trn=trn;

  /* pattern fallback inside the on-screen translator */
  var _PT=PT;
  PT=function(d){var r=_PT(d);if(r)return r;for(var i=0;i<PATS.length;i++)if(PATS[i][0].test(d))return d.replace(PATS[i][0],PATS[i][1]);return sym(d)};

  /* translator also runs when only the quiz is switched to English; also covers textarea placeholders */
  var _tr=tr;
  tr=function(){
    if(typeof quiz!=="undefined"&&quiz&&quiz.lang==="en"&&S.lang!=="en"){var s=S.lang;S.lang="en";try{_tr()}finally{S.lang=s}}
    else _tr();
    if(isEn())[].forEach.call(document.querySelectorAll("#app textarea,#app input"),function(i){var p=i.getAttribute("placeholder");if(p){var t=trn(p);if(t!==p)i.setAttribute("placeholder",t)}});
  };

  /* digits follow the quiz language too */
  bd=function(s){if(isEn())return String(s);return String(s).replace(/\d/g,function(d){return BN[d]})};

  /* toasts */
  var _toast2=toast;toast=function(m){_toast2(trn(m))};
  /* bottom sheets */
  if(window.qzSheet){var _qs=window.qzSheet;window.qzSheet=function(msg,btns){return _qs(trn(msg),(btns||[]).map(function(b){var c={};for(var k in b)c[k]=b[k];c.t=trn(b.t);return c}))}}
  /* confirm dialogs */
  var _cf=window.confirm;window.confirm=function(m){return _cf.call(window,trn(m))};
  /* messages shown inside the Add Question form (they sit in a box the translator skips) */
  if(typeof addv==="function"){var _av=addv;window.addv=addv=function(){var h=_av.apply(this,arguments);return isEn()?h.replace(/<div class="ex">([^<]*)<\/div>/,function(m,t){return '<div class="ex">'+trn(t)+'</div>'}):h}}

  /* voice help sheet */
  window.TTSEN='<div style="background:#fff;color:#111;border-radius:16px;max-width:420px;width:100%;padding:20px;max-height:85vh;overflow:auto;font-size:15px;line-height:1.7">'
  +'<div style="font-size:18px;font-weight:700;margin-bottom:8px">🔊 Reading aloud in Bangla needs a Bengali voice on your phone</div>'
  +'<div>No Bengali voice was found on this phone, so the app can\'t read questions aloud in Bangla. You only need to do the steps below once:</div>'
  +'<div style="margin-top:10px"><b>Android:</b><br>1. Settings → Language &amp; input (or General management) → Text-to-speech<br>2. Choose Google Text-to-speech → Install voice data<br>3. Download <b>Bengali (Bangladesh)</b> or <b>Bengali (India)</b> from the list<br>4. Close the app and open it again</div>'
  +'<div style="margin-top:10px"><b>iPhone:</b><br>1. Settings → Accessibility → Spoken Content → Voices<br>2. Choose Bengali and download the voice<br>3. Close the app and open it again</div>'
  +'<div style="margin-top:10px;opacity:.75">Until then, you can switch the question to English and listen with an English voice.</div>'
  +'<button style="margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:16px;font-weight:700" onclick="document.getElementById(\'ttsh\').remove()">OK</button></div>';

  /* the splash screens that are already on screen when this script runs */
  if(isEn()){
    var sp=document.getElementById("sp");if(sp){var dv=sp.querySelectorAll("div");var l=dv[dv.length-1];if(l&&/[\u0980-\u09FF]/.test(l.textContent))l.textContent="A little every day"}
  }
  try{render()}catch(e){}
})();

</script>
