/* one palette for every tile + dark-mode shadows */
.grid .tile:nth-child(n){--c:#2a4bdc}
html.dk .grid .tile:nth-child(n){--c:#7fa2ff}
html.dk svg.i{filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
html.dk nav button:not(.on) .i{filter:grayscale(.7) opacity(.7)}
/* dark mode: keep right/wrong answer colours */
html.dk .opt.ok{border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
html.dk .opt.bad{border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
html.dk .opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
html.dk .opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}

/* theme picker */
.dots{display:inline-flex;align-items:center;flex:none}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);box-shadow:0 2px 5px rgba(0,0,0,.2)}
.dots i+i{margin-left:-8px}
.thr{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.thr .dots i{width:28px;height:28px}
.chev{font-size:28px;line-height:1;color:var(--mute)}
.rst{margin:12px 0 4px}
.rst button{width:100%;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:11px 12px;font-weight:700;color:var(--mute)}
#thov{position:fixed;inset:0;z-index:120;background:rgba(5,10,30,.5);display:flex;align-items:flex-end;justify-content:center;animation:thf .2s}
#thov .sh{width:100%;max-width:480px;max-height:86vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:thu .28s ease-out;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@keyframes thf{from{opacity:0}}@keyframes thu{from{transform:translateY(40px);opacity:.4}}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:2px auto 12px}
.shh{display:flex;justify-content:space-between;align-items:center}.shh b{font-size:20px}
.shh button{border:0;background:var(--bg);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:16px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tc{position:relative;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:8px;text-align:left}
.tc .pv{display:block;height:64px;border-radius:14px;position:relative;overflow:hidden}
.tc .pv i{position:absolute;right:8px;bottom:8px;width:36px;height:14px;border-radius:8px}
.tc .pv u{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.35)}
.tc b{display:block;margin:8px 4px 2px;font-size:15px}
.tc.on{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
.tc.on::after{content:"✓";position:absolute;top:14px;right:14px;color:#fff;background:rgba(0,0,0,.3);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700}
.rb{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;font-weight:700}

<script>

  };
  /* কোন কোন বিষয়ে প্রশ্ন তৈরি হয়েছে (ready.json) */
  function cget(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
  function cset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function setReady(d){var m={};(d.ready||[]).forEach(function(x){m[x]=1});READY={set:m,list:d.ready||[],total:d.total||0};window.QZREADY=READY;return READY}

  function topicId(title){

    if(c&&c.length){idMap=mk(c);getJSON(QBASE+"topics.json",true).then(function(a){cset("qz:topics",a);idMap=mk(a)}).catch(function(){});return Promise.resolve(idMap[title])}

  }

  function load(title){

        function(e){if(e==="net"||e==="slow")throw e;/* এই বিষয়ের ফাইল এখনও তৈরি হয়নি */});
    });

  window.loadTopic=load;
  function loadAll(list){

  }
  /* মিশ্র কুইজের (মক টেস্ট, দৈনিক চ্যালেঞ্জ) জন্য কয়েকটা প্রস্তুত বিষয় নামানো */
  function ensureMix(cb){

      var list=(r?r.list:[]).slice();
      for(var i=list.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=list[i];list[i]=list[j];list[j]=t}
      return loadAll(list.slice(0,4));
    }).then(function(){cb(Q.length>0)},function(e){cb(false,e)});
  }
  window.qzEnsureMix=ensureMix;
  function withPool(arr,fn){

      return html;

  /* হোম পেজের বক্সে যেগুলোর প্রশ্ন নেই সেগুলো ঝাপসা + "শীঘ্রই আসছে" */
  if(typeof home==="function"){

  try{topicId("")}catch(e){}

<script>
/* ===== ভালো স্কোরে রঙিন উৎসব ===== */
(function(){
  if(typeof fin!=="function")return;
  function burst(){
    var c=document.createElement("canvas");
    c.style.cssText="position:fixed;left:0;top:0;width:100%;height:100%;z-index:900;pointer-events:none";
    var W=c.width=window.innerWidth,H=c.height=window.innerHeight;
    document.body.appendChild(c);
    var g=c.getContext("2d"),cols=["#fcc419","#3f5eff","#ff6b6b","#51cf66","#ffffff","#845ef7"],ps=[];
    for(var i=0;i<110;i++)ps.push({x:W/2+(Math.random()-.5)*80,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*13-3,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]});
    var t0=Date.now();
    (function f(){
      var el=Date.now()-t0;g.clearRect(0,0,W,H);
      ps.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.globalAlpha=Math.max(0,1-el/2600);g.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);g.restore()});
      if(el<2600)requestAnimationFrame(f);else c.remove();
    })();
  }
  var _fin=fin;
  window.fin=fin=function(){
    var r=_fin.apply(this,arguments);
    try{if(quiz&&quiz.done&&!quiz.cf){quiz.cf=1;if(quiz.list.length>0&&quiz.score/quiz.list.length>=0.7)burst()}}catch(e){}
    return r;
  };
})();
</script>

<script>
/* ===== রোজকার রিমাইন্ডার (শুধু অ্যান্ড্রয়েড অ্যাপে; নোটিফিকেশনের অনুমতি লাগে) ===== */
(function(){
  var LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
  if(!LN||typeof custom!=="function")return;
  var MSG=["আজকের কুইজ বাকি আছে। ১০ মিনিটে স্ট্রিক ধরে রাখো! 🔥","একটু সময় বের করে আজকের প্রশ্নগুলো সমাধান করে ফেলো।","তোমার প্রস্তুতি অপেক্ষা করছে। চলো শুরু করি!"];
  var MSGE=["Today's quiz is still waiting. Keep your streak alive in 10 minutes! 🔥","Take a little time and finish today's questions.","Your preparation is waiting. Let's get started!"];
  function rem(){if(!S.rem||typeof S.rem!=="object")S.rem={on:false,h:20,m:0};return S.rem}
  function p2(n){return (n<10?"0":"")+n}
  function plan(){
    var r=rem();
    return Promise.resolve(LN.cancel({notifications:[{id:1}]})).catch(function(){}).then(function(){
      if(!r.on)return;
      return LN.schedule({notifications:[{id:1,title:"Simple Quiz",body:(S.lang==="en"?MSGE:MSG)[Math.floor(Math.random()*MSG.length)],schedule:{on:{hour:r.h,minute:r.m},allowWhileIdle:true}}]});
    });
  }
  window.remToggle=function(){
    var r=rem();
    if(r.on){r.on=false;save();plan().catch(function(){});toast("রিমাইন্ডার বন্ধ হয়েছে");render();return}
    Promise.resolve(LN.requestPermissions()).then(function(p){
      if(p&&p.display==="granted"){
        r.on=true;save();
        return plan().then(function(){toast("রোজ "+bd(p2(r.h)+":"+p2(r.m))+"-এ রিমাইন্ডার আসবে");render()});
      }
      toast("নোটিফিকেশনের অনুমতি দাওনি। ফোনের সেটিংস থেকে চালু করতে পারো।");
    }).catch(function(){toast("রিমাইন্ডার চালু করা গেল না")});
  };
  window.remTime=function(v){
    var r=rem(),p=String(v||"").split(":");
    if(p.length<2||isNaN(+p[0])||isNaN(+p[1]))return;
    r.h=+p[0];r.m=+p[1];save();
    if(r.on)plan().then(function(){toast("সময় বদলে "+bd(p2(r.h)+":"+p2(r.m))+" হয়েছে")}).catch(function(){});
  };
  var _custom=custom;
  window.custom=custom=function(){
    var r=rem();
    return _custom()+'<h2>রিমাইন্ডার</h2><div class="card"><div class="row"><div><b>রোজ মনে করিয়ে দেবে</b><div class="sm">প্রতিদিন তোমার বেছে নেওয়া সময়ে একটা বার্তা আসবে।</div></div>'
      +'<button class="'+(r.on?'btn':'ob')+'" onclick="remToggle()">'+(r.on?'চালু':'বন্ধ')+'</button></div>'
      +'<div style="margin-top:10px"><span class="sm">সময়: </span><input type="time" id="remt" value="'+p2(r.h)+':'+p2(r.m)+'" onchange="remTime(this.value)" style="font-size:16px;padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)"></div></div>';
  };
  if(rem().on)plan().catch(function(){});
})();
</script>
