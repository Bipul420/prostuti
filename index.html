<style>
:root{--bg:#f4f6fc;--card:#fff;--ink:#0f1a3a;--mute:#5b6585;--line:#dde1f0;--pri:#2e3fa8;--on:#fff;--ok:#12806a;--bad:#b4530a;--warm:#fdeccb;--warmink:#6b3d00;--off:#dde1f0;--okbg:#e6f5f1;--badbg:#fbeee3}
@media not all{:root:not([data-theme="light"]){--bg:#0e1226;--card:#171c36;--ink:#eef0fb;--mute:#9aa3c7;--line:#2b3157;--pri:#7d8cf5;--on:#0e1226;--ok:#3cc2a2;--bad:#f0914a;--warm:#3a2d12;--warmink:#f5cf8a;--off:#2b3157;--okbg:#12302a;--badbg:#38241a}}
html.dk{--bg:#0e1226;--card:#171c36;--ink:#eef0fb;--mute:#9aa3c7;--line:#2b3157;--pri:#7d8cf5;--on:#0e1226;--ok:#3cc2a2;--bad:#f0914a;--warm:#3a2d12;--warmink:#f5cf8a;--off:#2b3157;--okbg:#12302a;--badbg:#38241a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;font-size:16px;line-height:1.45}
#app{max-width:480px;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:30px;margin:0 0 14px;font-weight:700;line-height:1.2}
h2{font-size:17px;margin:18px 0 8px;font-weight:700}.sec{font-size:22px;font-weight:700;color:var(--pri);margin:30px 0 0;padding-top:14px;border-top:2px solid var(--line)}.sec:first-of-type{margin-top:6px;border:0;padding:0}
.sm{color:var(--mute);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:var(--warm);color:var(--warmink);border-radius:999px;padding:6px 14px;font-weight:700}
.hero{background:linear-gradient(135deg,#2e3fa8,#5b4fd8);color:#fff;border-radius:22px;padding:18px;margin:14px 0 12px;box-shadow:0 8px 20px rgba(46,63,168,.28)}.hero .btnw{background:#fff;color:#2e3fa8}
.hero b{font-size:20px;display:block}
.btnw{background:var(--on);color:var(--pri);border:0;border-radius:14px;padding:12px 18px;font-weight:700}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:14px;padding:12px 18px;font-weight:700}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:7px 14px;margin:0 6px 8px 0}
.chip.on{background:var(--pri);color:var(--on);border-color:var(--pri);font-weight:600}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{text-align:left;padding:14px 16px;background:var(--card);border:2px solid var(--line);border-radius:18px}
.tile b{display:block;font-size:18px}
.seg{display:flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);margin-top:10px}
.seg button{flex:1;border:0;background:none;padding:11px 4px}
.seg button.on{background:var(--pri);color:var(--on);font-weight:600}
.sw{width:52px;height:32px;border-radius:99px;background:var(--off);border:0;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--pri)}.sw.on::after{transform:translateX(20px)}
.set{padding:12px 0;border-bottom:2px solid var(--line)}.set:last-child{border:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;padding:9px 4px 8px;font-size:13px;line-height:1.25;color:var(--mute)}
nav button.on{color:var(--pri);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ob{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px}
.bar{height:10px;background:var(--off);border-radius:9px;margin:10px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:9px;transition:width .3s}
.q{font-size:22px;font-weight:700;margin:16px 0}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:18px}
.opt .k{width:44px;height:44px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;font-weight:700;flex:none}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.ex{border-left:6px solid var(--pri);background:var(--card);border-radius:10px;padding:12px 14px;margin:4px 0 16px}
.big{font-size:56px;font-weight:700;color:var(--pri);text-align:center;margin:20px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:9}
.tile,.card,.opt{box-shadow:0 2px 6px rgba(15,26,58,.06)}.tile,.opt,.btn,.chip{transition:transform .1s,border-color .15s,background .15s}.tile:active,.opt:active,.btn:active{transform:scale(.97)}.ic{display:block;font-size:28px;margin-bottom:6px}@keyframes pop{50%{transform:scale(1.03)}}.opt.ok{animation:pop .3s}.opt .k{background:var(--bg)}.q{line-height:1.5}button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.mini{margin:0;flex:none}.mini button{padding:7px 12px}.on2{background:var(--pri)!important;color:var(--on);border-color:var(--pri)}.set .sm{max-width:200px}.ad{margin:16px 0;padding:18px;border:2px dashed var(--line);border-radius:14px;text-align:center;color:var(--mute);background:var(--card)}.fb{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:var(--mute)}.fb button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:18px}:root{--bg2:#e4e8ff}html.dk{--bg2:#1a2050}
body{background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 340px) no-repeat,var(--bg)}
#app{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
h1{background:linear-gradient(90deg,var(--ink),var(--pri));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.card,.tile{border-width:1px;border-radius:20px;box-shadow:0 6px 18px rgba(46,63,168,.08)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#2e3fa8,#7a4fe0 60%,#c04fd8);padding:22px;border-radius:26px;box-shadow:0 14px 30px rgba(94,72,216,.35);animation:rise .45s both}
.hero::before{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.13)}
.hero::after{content:"";position:absolute;left:35%;bottom:-70px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero>*{position:relative;z-index:1}.hero .btnw{box-shadow:0 6px 14px rgba(0,0,0,.18)}
.btn{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 55%,#c04fd8));box-shadow:0 6px 14px rgba(94,72,216,.28)}
.grid .tile{animation:rise .45s both}.grid .tile:nth-child(2){animation-delay:.05s}.grid .tile:nth-child(3){animation-delay:.1s}.grid .tile:nth-child(4){animation-delay:.15s}.grid .tile:nth-child(5){animation-delay:.2s}.grid .tile:nth-child(6){animation-delay:.25s}
.grid .tile .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:26px;margin-bottom:10px;background:color-mix(in srgb,var(--c,#6366f1) 17%,transparent)}
.grid .tile:nth-child(1){--c:#6366f1}.grid .tile:nth-child(2){--c:#10b981}.grid .tile:nth-child(3){--c:#f59e0b}.grid .tile:nth-child(4){--c:#ec4899}.grid .tile:nth-child(5){--c:#0ea5e9}.grid .tile:nth-child(6){--c:#8b5cf6}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.chip{border-width:1px;box-shadow:0 2px 6px rgba(46,63,168,.06)}
.q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 6px 18px rgba(46,63,168,.08)}
.opt{border-radius:18px}.bar{height:12px}.bar i{background:linear-gradient(90deg,var(--pri),#c04fd8)}
.big{background:linear-gradient(90deg,var(--pri),#c04fd8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:pop3 .6s}
@keyframes pop3{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-bottom:0;border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(15,26,58,.16)}
nav div{padding:4px}nav button{border-radius:18px}nav button.on{background:color-mix(in srgb,var(--pri) 14%,transparent)}
.toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
#sp{position:fixed;inset:0;z-index:99;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#2e3fa8,#7a4fe0 60%,#c04fd8);color:#fff;pointer-events:none;animation:spf 1.5s forwards}
@keyframes spf{0%,65%{opacity:1}100%{opacity:0;visibility:hidden}}
.i{width:24px;height:24px;display:block;flex:none}nav .i{margin:0 auto 3px}.tile .ic .i{width:26px;height:26px;color:var(--c,#6366f1)}
#ob{position:fixed;inset:0;z-index:98;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;padding-top:calc(32px + env(safe-area-inset-top,0px))}
#ob .obi{width:132px;height:132px;border-radius:36px;display:grid;place-items:center;background:linear-gradient(135deg,#2e3fa8,#c04fd8);color:#fff;box-shadow:0 18px 40px rgba(94,72,216,.35);margin-bottom:28px}
#ob .obi .i{width:64px;height:64px}#ob .obi.lg{background:none}#ob .obi.lg svg{width:132px;height:132px;border-radius:36px}
#ob h2{font-size:26px;margin:0 0 10px}#ob p{color:var(--mute);max-width:300px;line-height:1.6;margin:0}

/* ===== Simple Quiz theme: royal blue + sunny yellow ===== */
:root{--pri:#2a4bdc;--bg:#eef3ff;--bg2:#d6e3ff;--acc:#ffc928;--accink:#3a2a00;--warm:#fff1c2;--warmink:#6b4a00}
html.dk{--pri:#7fa2ff;--bg:#0b1230;--bg2:#13205e;--card:#14204a;--line:#27386f;--on:#0b1230;--off:#27386f}
body{background:radial-gradient(circle at 100% 0,rgba(255,201,40,.28),transparent 230px),radial-gradient(circle at 0 120px,rgba(42,75,220,.16),transparent 260px),linear-gradient(180deg,var(--bg2) 0,var(--bg) 380px) no-repeat,var(--bg)}
h1{background:linear-gradient(90deg,#1736c9,#2a4bdc 55%,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
html.dk h1{background:linear-gradient(90deg,#fff,#9db8ff 55%,#ffd45c);-webkit-background-clip:text;background-clip:text}
.hero{background:linear-gradient(135deg,#1736c9,#2a4bdc 55%,#5b6cff);box-shadow:0 14px 30px rgba(23,54,201,.38)}
.hero::before{background:rgba(255,201,40,.30);width:170px;height:170px}
.hero::after{background:rgba(255,255,255,.10)}
.hero b{font-size:22px}
.hero .btnw{background:linear-gradient(180deg,#ffd84d,#ffb800);color:var(--accink);box-shadow:0 6px 0 #d99a00,0 10px 18px rgba(0,0,0,.2);font-size:17px;padding:13px 22px}
.hero .btnw:active{transform:translateY(4px);box-shadow:0 2px 0 #d99a00}
.btn{background:linear-gradient(135deg,#3b63ff,#1736c9);color:#fff;box-shadow:0 6px 0 #11279a,0 10px 18px rgba(23,54,201,.25)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #11279a}
html.dk .btn{color:#fff}
.card,.tile{border-color:color-mix(in srgb,var(--pri) 14%,var(--line));box-shadow:0 8px 22px rgba(42,75,220,.10)}
.tile{position:relative;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--c,#6366f1) 14%,var(--card)),var(--card) 70%)}
.tile::after{content:"";position:absolute;right:-18px;bottom:-18px;width:70px;height:70px;border-radius:50%;background:color-mix(in srgb,var(--c,#6366f1) 16%,transparent)}
.tile b{position:relative;z-index:1}
.grid .tile .ic{box-shadow:0 4px 10px color-mix(in srgb,var(--c,#6366f1) 25%,transparent)}
.chip{background:var(--card)}
.chip.on,.seg button.on,.on2{background:linear-gradient(135deg,#3b63ff,#1736c9)!important;color:#fff!important;border-color:#1736c9!important}
html.dk .chip.on,html.dk .seg button.on,html.dk .on2{background:linear-gradient(135deg,#7fa2ff,#4f74ff)!important;color:#0b1230!important}
.sw.on{background:linear-gradient(135deg,#3b63ff,#1736c9)}
.sec{color:var(--pri);border-top:2px dashed color-mix(in srgb,var(--acc) 70%,transparent)}
.q{border-left:7px solid var(--acc);background:linear-gradient(135deg,var(--card),color-mix(in srgb,var(--acc) 7%,var(--card)))}
.opt{border-width:2px;border-color:color-mix(in srgb,var(--pri) 18%,var(--line));box-shadow:0 4px 0 color-mix(in srgb,var(--pri) 16%,var(--line))}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{background:color-mix(in srgb,var(--pri) 12%,var(--card));border-color:var(--pri);color:var(--pri)}
.opt.ok{box-shadow:0 4px 0 var(--ok)}.opt.bad{box-shadow:0 4px 0 var(--bad)}
.opt.ok .k,.opt.bad .k{color:#fff}
.bar{height:14px;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.bar i{background:linear-gradient(90deg,#3b63ff,#ffc928)}
.big{background:linear-gradient(90deg,#2a4bdc,#f59e0b);-webkit-background-clip:text;background-clip:text;font-size:64px}
.ob{border-color:color-mix(in srgb,var(--pri) 25%,var(--line));font-weight:600}
nav{background:color-mix(in srgb,var(--card) 92%,transparent);border-color:color-mix(in srgb,var(--pri) 18%,var(--line))}
nav button.on{background:color-mix(in srgb,var(--acc) 30%,transparent);color:var(--pri)}
html.dk nav button.on{color:#ffd45c;background:rgba(255,201,40,.16)}
#sp{background:radial-gradient(circle at 50% 38%,#3b63ff 0,#1736c9 45%,#0a1f7a 100%)}
#sp img{animation:bounceIn .7s both;filter:drop-shadow(0 14px 24px rgba(0,0,0,.35))}
@keyframes bounceIn{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.obi.lg{box-shadow:none}.obi.lg img{filter:drop-shadow(0 14px 22px rgba(23,54,201,.35))}
/* ===== colour harmony fix (light + dark) ===== */
:root{--bg:#f1f5ff;--bg2:#dfe9ff;--mute:#4f5b82}
html.dk{--mute:#b4bfe6;--ink:#f2f5ff;--bg:#0a1233;--bg2:#12206a}
body{background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 360px) no-repeat,var(--bg)}
h1{background:linear-gradient(90deg,#1736c9,#3b63ff);-webkit-background-clip:text;background-clip:text}
html.dk h1{background:linear-gradient(90deg,#ffffff,#b9ccff);-webkit-background-clip:text;background-clip:text}
.hero::before{background:rgba(255,255,255,.14)}
.hero::after{background:rgba(255,201,40,.18)}
nav button.on{background:color-mix(in srgb,var(--acc) 22%,transparent)}
html.dk nav button.on{background:rgba(255,201,40,.14);color:#ffd45c}
.tile .sm,.card .sm{color:var(--mute)}
html.dk .tile{background:linear-gradient(160deg,color-mix(in srgb,var(--c,#6366f1) 20%,var(--card)),var(--card) 75%);border-color:color-mix(in srgb,var(--c,#6366f1) 30%,var(--line))}
html.dk input::placeholder{color:#93a0d0;opacity:1}
input::placeholder{color:#6b779e;opacity:1}

html.dk .opt{border-color:#33468a;box-shadow:0 4px 0 #1b2a62}

html.dk .ex,html.dk .card{border-color:#2b3d7c}
html.dk .ob,html.dk .chip{border-color:#3a4f9a;color:#eaf0ff}
html.dk .big{background:linear-gradient(90deg,#8fb0ff,#ffd45c);-webkit-background-clip:text;background-clip:text}
.pill{background:var(--warm);color:var(--warmink)}

/* ===== safety layer for older phones / forced-dark browsers ===== */
h1,html.dk h1{background:none!important;-webkit-text-fill-color:currentColor!important;color:#1736c9}
html.dk h1{color:#fff}
.big,html.dk .big{background:none!important;-webkit-text-fill-color:currentColor!important;color:#2a4bdc}
html.dk .big{color:#ffd45c}
@supports not (color:color-mix(in srgb,red,blue)){
 .card,.tile,.opt,.ob,.chip{border-color:var(--line)}
 .tile,.q{background:var(--card)}
 .opt .k{background:#e3eaff}html.dk .opt .k{background:#1b2a62}
 nav,nav button.on{background:var(--card)}nav button.on{background:rgba(255,201,40,.28)}
 .btn{background:linear-gradient(135deg,#3b63ff,#1736c9)}
 .grid .tile .ic{background:rgba(42,75,220,.12)}
}

/* no decorative circles */
.hero::before,.hero::after,.tile::after{content:none!important;display:none!important}


/* realistic icons */
svg.i{filter:drop-shadow(0 2px 2.5px rgba(15,26,58,.22))}
.grid .tile .ic{width:60px;height:60px;border-radius:20px;background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--c,#6366f1) 14%,#fff));box-shadow:inset 0 1px 0 #fff,0 6px 14px color-mix(in srgb,var(--c,#6366f1) 22%,transparent)}
html.dk .grid .tile .ic{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.tile .ic .i{width:44px;height:44px}
nav .i{width:30px;height:30px}
nav button:not(.on) .i{filter:grayscale(.8) opacity(.75)}
#ob .obi:not(.lg){background:var(--card);border:1px solid var(--line);box-shadow:0 18px 40px rgba(42,75,220,.22)}
#ob .obi .i{width:88px;height:88px}

/* one palette for every tile + dark-mode shadows */
.grid .tile:nth-child(n){--c:#2a4bdc}
html.dk .grid .tile:nth-child(n){--c:#7fa2ff}
html.dk svg.i{filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
html.dk nav button:not(.on) .i{filter:grayscale(.7) opacity(.7)}
/* dark mode: keep right/wrong answer colours */
html.dk .opt.ok{border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
html.dk .opt.bad{border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
html.dk .opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
html.dk .opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}

      idMap={};a.forEach(function(t){idMap[t.title]=t.id});return idMap[title];
    });
  }
  function addQs(arr){
    var have={};Q.forEach(function(q){have[qid(q)]=1});
    arr.forEach(function(q){
      if(q&&q.bn&&q.o&&q.o.length===4&&q.a>=0&&q.a<4&&!have[qid(q)]){Q.push(q);have[qid(q)]=1}
    });
  }
  function load(title){
    return topicId(title).then(function(id){
      if(!id||done[id])return;
      return getJSON(QBASE+"questions/"+id+".json").then(function(arr){addQs(arr);done[id]=1},
        function(e){if(e==="net")throw e;/* এই বিষয়ের ফাইল এখনও তৈরি হয়নি */});
    });
  }
  function say(m){try{toast(m)}catch(e){alert(m)}}
  window.start=start=function(title,keys,n,ids){
    var a=arguments, self=this;
    if(ids||!title||busy)return _start.apply(self,a);
    busy=true;
    var t=setTimeout(function(){say("প্রশ্ন লোড হচ্ছে…")},700);
    load(title).then(function(){clearTimeout(t);busy=false;_start.apply(null,a)},function(e){
      clearTimeout(t);busy=false;
      if(e==="net")say("প্রশ্ন পেতে ইন্টারনেট চালু করুন");
      else _start.apply(null,a);
    });
  };
})();
</script>
